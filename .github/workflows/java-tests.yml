name: Java Playwright UI Tests (Saucedemo)
on:
  push:
  # Закомментировано, чтобы пайплайн реагировал на любые изменения:
  # paths:
  #   - 'src/**'
  #   - 'pom.xml'
  pull_request:
    branches: [ main, master ]
    # paths:
    #   - 'src/**'
    #   - 'pom.xml'

  workflow_dispatch:
    inputs:
      browser:
        description: 'Выберите браузер'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox

      headless:
        description: 'Запустить в скрытом режиме (Headless)?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

#      test_folder:
#        description: 'Choose the folder'
#        required: false
#        default: 'saucedemo'
#        type: choice
#        options:
#          - saucedemo
#          - soloTests
#
#      test_filter:
#        description: 'Какие тесты запустить? (Пусто = ВСЕ)'
#        required: false
#        default: ''
#        type: choice
#        options:
#          - ''
#          - 'one'
#          - 'smoke'
#          - 'regress'

      test_tags:
        description: 'Run by Tag (Пусто = ВСЕ. Примеры: LoginTest, *Smoke*, LoginTest#coreTest)'
        required: false
        default: ''
        type: string

      username:
        description: 'Имя пользователя (Login)'
        required: true
        default: 'standard_user'
        type: choice
        options:
          - 'standard_user'
          - 'locked_out_user'
          - 'problem_user'
          - 'performance_glitch_user'
          - 'error_user'
          - 'visual_user'

      password:
        description: 'Пароль (Password)'
        required: true
        default: 'secret_sauce'
        type: password

permissions:
  checks: write
  contents: write # Даем права на запись, чтобы пушить отчет в ветку gh-pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'oracle'
          cache: 'maven'

      - name: Build Project to download Playwright
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: mvn test-compile -B -ntp

      - name: Install Playwright Browsers
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: mvn exec:java -q -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install"

      - name: Install Playwright Operating System Dependencies
        run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install-deps"

      - name: Update Dependencies and Build Project
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        # Сначала обновляем все зависимости в pom.xml до последних стабильных версий, затем компилируем
        run: |
          mvn versions:use-latest-releases -DgenerateBackupPoms=false -B -ntp
          mvn test-compile -B -ntp

      - name: Run Tests with Maven
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        # Закомментированная логика папок и фильтров (для восстановления перенесите внутрь run):
        # ${{ github.event.inputs.test_folder == 'all_packages' && (github.event.inputs.test_filter != '' && format('-Dtest={0}', github.event.inputs.test_filter) || '') || (github.event.inputs.test_filter != '' && format('-Dtest={0}.{1}', github.event.inputs.test_folder, github.event.inputs.test_filter) || format('-Dtest={0}.**', github.event.inputs.test_folder)) }}
        run: |
          mvn test -B -ntp \
          -Dchosen.browser="${{ github.event.inputs.browser || 'chromium' }}" \
          -Dchosen.headless="${{ github.event.inputs.headless || 'true' }}" \
          -Dtest.username="${{ github.event.inputs.username || 'standard_user' }}" \
          -Dtest.password="${{ github.event.inputs.password || 'secret_sauce' }}" \
          ${{ github.event.inputs.test_tags != '' && github.event.inputs.test_tags != 'all' && format('-Dgroups="{0}"', github.event.inputs.test_tags) || '' }}

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: target/surefire-reports/
          retention-days: 5

      - name: Publish Test Report Summary
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          detailed_summary: true
          include_passed: true

      # 1. Скачиваем историю из ветки gh-pages, чтобы Allure подтянул прошлые тренды
      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: target/allure-results/history # Качаем историю строго туда, где её ждет Maven

      # Теперь Maven соберет отчет, даже если тесты упали, и не заблокирует билд
      - name: Generate Allure Report via Maven
        if: always()
        run: mvn allure:report -Dallure.install.dir=${{ github.workspace }}/.allure || true

      # 3. Публикуем сгенерированный HTML-отчет (он лежит в target/site/allure-maven-plugin)
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/site/allure-maven-plugin