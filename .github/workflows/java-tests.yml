name: Java Playwright UI Tests (Saucedemo)
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Выберите браузер'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox

      headless:
        description: 'Запустить в скрытом режиме (Headless)?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

      test_tags:
        description: 'Фильтр тестов (Имя класса или паттерн. Пусто = ВСЕ. Примеры: LoginTest, *Smoke*)'
        required: false
        default: ''
        type: string

      username:
        description: 'Имя пользователя (Login)'
        required: true
        default: 'standard_user'
        type: choice
        options:
          - 'standard_user'
          - 'locked_out_user'
          - 'problem_user'
          - 'performance_glitch_user'
          - 'error_user'
          - 'visual_user'

      password:
        description: 'Пароль (Password)'
        required: true
        default: 'secret_sauce'
        type: password

permissions:
  checks: write
  contents: write # Права для публикации отчета в ветку gh-pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'oracle'
          cache: 'maven'

      # Компилируем проект один раз, подгружая правильные зависимости из нашего pom.xml
      - name: Build Project and Download Dependencies
        run: mvn test-compile -B -ntp

      # Установка бинарников Playwright через CLI фреймворка
      - name: Install Playwright Browsers
        run: mvn exec:java -q -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install"

      # Установка системных зависимостей ОС (библиотеки Linux для Chromium/Firefox)
      - name: Install Playwright Operating System Dependencies
        run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install-deps"

      # Запуск тестов. Изменен синтаксис передачи тегов на стандартный -Dtest для Maven Surefire.
      - name: Run Tests with Maven
        run: |
          mvn test -B -ntp \
          -Dchosen.browser="${{ github.event.inputs.browser || 'chromium' }}" \
          -Dchosen.headless="${{ github.event.inputs.headless || 'true' }}" \
          -Dtest.username="${{ github.event.inputs.username || 'standard_user' }}" \
          -Dtest.password="${{ github.event.inputs.password || 'secret_sauce' }}" \
          ${{ github.event.inputs.test_tags != '' && format('-Dtest="{0}"', github.event.inputs.test_tags) || '' }}

      - name: Upload Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: target/surefire-reports/
          retention-days: 5

      - name: Publish Test Report Summary
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          detailed_summary: true
          include_passed: true

      # Скачиваем историю Allure из ветки gh-pages для сохранения графиков
      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: target/allure-results/history

      # Генерация HTML отчета через плагин
      - name: Generate Allure Report via Maven
        if: always()
        run: mvn allure:report -Dallure.install.dir=${{ github.workspace }}/.allure || true

      # Публикация готового сайта-отчета на GitHub Pages
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/site/allure-maven-plugin